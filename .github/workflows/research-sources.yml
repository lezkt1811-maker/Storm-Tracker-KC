name: Research official sources

# On-demand, low-volume research job (a few dozen requests, run manually).
# Fetches official pages/documents and site-metadata feeds and prints what
# they say, so records in data/weather-modification.json and coordinates in
# data/atmospheric-sites.json come from primary sources rather than memory.
on:
  workflow_dispatch: {}

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Tools
        run: sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
      - name: Research
        run: |
          UA="StormTrackerKC/1.0 (github.com/lezkt1811-maker/Storm-Tracker-KC)"
          get() { curl -sSL -m 40 -A "$UA" -o "$2" -w "%{http_code} %{content_type} %{size_download}" "$1"; }
          txt() { python3 -c "import re,sys,html;t=open(sys.argv[1],errors='ignore').read();t=re.sub(r'(?is)<(script|style).*?</\1>','',t);t=re.sub(r'<[^>]+>',' ',t);t=html.unescape(re.sub(r'\s+',' ',t));print(t[:int(sys.argv[2])])" "$1" "$2"; }
          sec() { echo; echo "=============== $1"; }

          sec "Zenodo dataset: NOAA cloud-seeding reports 2000-2025, filtered to KS/MO"
          get https://zenodo.org/api/records/14925811 /tmp/z.json >/dev/null
          python3 - <<'PY'
          import json, csv, io, urllib.request
          rec = json.load(open('/tmp/z.json'))
          print('title:', rec['metadata']['title'], '| version:', rec['metadata'].get('version'), '| published:', rec['metadata'].get('publication_date'))
          for f in rec['files']:
              print('file:', f['key'], f['size'])
              if not f['key'].endswith('.csv'): continue
              req = urllib.request.Request(f['links']['self'], headers={'User-Agent': 'StormTrackerKC/1.0'})
              raw = urllib.request.urlopen(req, timeout=60).read().decode('utf-8', 'ignore')
              rows = list(csv.DictReader(io.StringIO(raw)))
              print('rows:', len(rows), 'columns:', list(rows[0].keys()))
              states = {}
              for r in rows: states[r.get('state','')] = states.get(r.get('state',''),0)+1
              print('states:', sorted(states.items(), key=lambda x:-x[1]))
              for r in rows:
                  blob = ' '.join(str(v) for v in r.values())
                  if any(k in blob for k in ('Kansas','Missouri')) or r.get('state','').strip() in ('KS','MO'):
                      print('MATCH:', json.dumps(r))
          PY
