name: Aircraft Snapshot

# OpenSky's REST API doesn't send CORS headers for other origins, so the
# browser can't call it directly (confirmed by the probe workflow). This job
# fetches it server-side and commits static files that GitHub Pages serves
# same-origin (see scripts/aircraft_snapshot.py):
#   data/aircraft.json          latest positions + short track segments
#   data/aircraft-history.json  rolling 7-day aircraft-count history
#   data/aircraft-tracks.json   rolling 24-hour archive of every recording's tracks
#
# GitHub delays and often skips frequent cron triggers (a '*/30' schedule ran
# only twice in four hours here), so one run stays up for ~5.5 hours and takes
# a recording itself at every :00 and :30, committing after each. The hourly
# trigger only has to fire now and then to keep a run going; the concurrency
# group queues at most one more behind it (extra queued triggers show as
# "cancelled", which is expected). Each recording is 5 samples 60 s apart:
# 48 recordings x 5 = 240 requests a day, inside OpenSky's anonymous allowance.
# Free for public repos, no secrets.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: aircraft-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Record aircraft every 30 minutes for ~5.5 hours
        run: |
          git config user.name "storm-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p data
          deadline=$(( $(date +%s) + 330 * 60 ))
          while :; do
            git pull --rebase --autostash -q || true
            python3 scripts/aircraft_snapshot.py || echo "recording failed"
            git add data/aircraft.json data/aircraft-history.json data/aircraft-tracks.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Update aircraft snapshot [skip ci]"
              for i in 1 2 3; do
                git pull --rebase --autostash -q && git push -q && break
                sleep $(( i * 5 ))
              done
            fi
            now=$(date +%s)
            next=$(( (now / 1800 + 1) * 1800 ))
            # stop if the next recording (~5 min long) wouldn't finish in time
            if [ $(( next + 360 )) -gt "$deadline" ]; then break; fi
            sleep $(( next - now ))
          done
